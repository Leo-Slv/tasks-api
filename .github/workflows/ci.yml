name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Análise estática de código + formatação (mais rápido: falha cedo)
  lint:
    name: Análise estática e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Análise de formatação (Prettier)
        run: npm run format:check
      - name: Análise estática de código (ESLint)
        run: npm run lint

  # 2) Análise estática de segurança (SAST + dependências)
  security:
    name: Análise estática de segurança
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Vulnerabilidades em dependências (npm audit)
        run: npm run audit:prod
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Análise CodeQL (SAST)
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  # 3) Build
  build:
    name: Build
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 4) Testes unitários + integração (PostgreSQL como service container)
  test:
    name: Testes unitários e de integração
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Testes unitários
        run: npm run test:unit
      - name: Testes de integração
        run: npm run test:integration

  # 5) Criação da imagem Docker (somente build, sem publicar)
  image:
    name: Criar imagem Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tasks-api:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
