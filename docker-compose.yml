services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app_test
    ports: ['5432:5432']
  api:
    build: .
    environment:
      DATABASE_URL: postgres://test:test@db:5432/app_test
    ports: ['3000:3000']
    depends_on: [db]
